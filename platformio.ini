[env:uno_wifi_rev2]
platform = atmelmegaavr
board = uno_wifi_rev2
framework = arduino
lib_deps = 
	arduino-libraries/Arduino_LSM6DS3@^1.0.3
	arduino-libraries/WiFiNINA@^1.9.1
	knolleary/PubSubClient@^2.8
	arduino-libraries/ArduinoHttpClient@^0.6.1
	bblanchon/ArduinoJson@^7.4.1
