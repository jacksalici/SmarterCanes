
[env:uno_r4_modulino]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps = 
	arduino-libraries/Arduino_Modulino @ ^0.7.0
	arduino-libraries/ArduinoBLE @ ^1.4.0
build_src_filter = -<**/*.cpp> +<unoR4/**/*.cpp> +<*.h>

[env:uno_r4_stmems]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps = 
	stm32duino/STM32duino ISM330DLC@^2.0.1
build_src_filter = -<**/*.cpp> +<unoR4st/**/*.cpp> +<*.h>

[env:nicla_sense]
platform = nordicnrf52
board = nicla_sense_me
framework = arduino
lib_deps = 
	arduino-libraries/Arduino_BHY2 @ ^1.0.8
	arduino-libraries/ArduinoBLE @ ^1.4.0
build_src_filter = -<**/*.cpp> +<niclaSenseMe/**/*.cpp> +<*.h>

[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = 
	-DESP32S3
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DCORE_DEBUG_LEVEL=5
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps = 
	M5Unified=https://github.com/m5stack/M5Unified
	M5PM1=https://github.com/m5stack/M5PM1
build_src_filter = -<**/*.cpp> +<stickS3/**/*.cpp> +<*.h>
