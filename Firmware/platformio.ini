[env:uno_r4_modulino]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps = 
	arduino-libraries/Arduino_Modulino @ ^0.7.0
	arduino-libraries/ArduinoBLE @ ^1.4.0
build_src_filter = +<*_r4.cpp> +<*.h>
 
[env:nicla_sense]
platform = nordicnrf52
board = nicla_sense_me
framework = arduino
lib_deps = 
	arduino-libraries/Arduino_BHY2 @ ^1.0.8
	arduino-libraries/ArduinoBLE @ ^1.4.0
build_src_filter = -<*_r4.cpp> +<*.h>
